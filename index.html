
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pratyush AI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0b0f19;
    color:white;
    display:flex;
    flex-direction:column;
    height:100vh;
}

header{
    text-align:center;
    padding:20px;
    border-bottom:1px solid #1f2937;
}

header h1{
    font-size:2rem;
}

header p{
    color:#9ca3af;
}

#chat-container{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    max-width:80%;
    padding:12px 16px;
    margin:10px 0;
    border-radius:15px;
}

.user{
    background:#1d4ed8;
    margin-left:auto;
}

.bot{
    background:#151b2b;
    border:1px solid #273244;
}

#input-area{
    display:flex;
    padding:15px;
    background:#111827;
}

#messageInput{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
}

button{
    margin-left:10px;
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}
</style>
</head>

<body>

<header>
    <h1>🤖 Pratyush AI</h1>
    <p>Your Intelligent Gemini Assistant</p>
</header>

<div id="chat-container"></div>

<div id="input-area">
    <input
        type="text"
        id="messageInput"
        placeholder="Message Pratyush AI..."
    >
    <button onclick="sendMessage()">Send</button>
</div>

<script>

async function sendMessage(){

    const input = document.getElementById("messageInput");
    const message = input.value.trim();

    if(message==="") return;

    const chat = document.getElementById("chat-container");

    chat.innerHTML += `
        <div class="message user">
            ${message}
        </div>
    `;

    input.value="";

    try{

        const response = await fetch(
            "YOUR_BACKEND_API_URL",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    message:message
                })
            }
        );

        const data = await response.json();

        chat.innerHTML += `
            <div class="message bot">
                ${data.reply}
            </div>
        `;

        chat.scrollTop = chat.scrollHeight;

    }catch(error){

        chat.innerHTML += `
            <div class="message bot">
                Error connecting to AI service.
            </div>
        `;
    }
}
</script>

</body>
</html>
